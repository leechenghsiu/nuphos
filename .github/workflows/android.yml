name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android trigger UI evidence
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept SDK licenses and install platform
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platform-tools"
      - name: Enable KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual conversation trigger sheet
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          working-directory: apps/android
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb shell cmd uimode night no
            ./gradlew --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -PnuphosIsolatedRowActionsFixture=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ai.nuphos.android.FixtureDeviceTest#conversationTitleOpensTriggers
            mkdir -p ../../trigger-evidence
            adb pull /sdcard/Android/data/ai.nuphos.android.rowactions1357/files/review-2030/triggers-2096-android.png ../../trigger-evidence/android.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trigger-ui-evidence
          path: |
            trigger-evidence/
            apps/android/app/build/reports/androidTests/connected/debug/
          if-no-files-found: warn
